name: CI

on: push

jobs:
  lua:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      # - name:  Install libreadline
      #   run: |
      #     sudo apt-get install -y libreadline-dev

      - name: Install Lua
        run: |
          # pip install git+https://github.com/luarocks/hererocks
          pip install hererocks
          hererocks lua_install -r@v3.13.0 -j=2.1 -i

      - name: Run tests
        run: |
          source lua_install/bin/activate
          luarocks install luasec 1.0.2-1
          luarocks install lrexlib-pcre2 2.9.1-1 WITH_SHARED_LIBUV=ON
          luarocks install lrexlib-pcre2
          luarocks install lrexlib-pcre2 2.9.2-1
          luarocks install lrexlib-pcre2 2.9.1-1

      - name: Run tests
        if: always()
        run: |
          source lua_install/bin/activate
          luarocks install lrexlib-pcre2 --verbose
          luarocks install lrexlib-pcre2 2.9.2-1 --verbose
          luarocks install lrexlib-pcre2 2.9.1-1 --verbose
